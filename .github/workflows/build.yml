name: Build VoidLink IPA

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Build configuration
        type: choice
        default: Release
        options:
          - Debug
          - Release
  push:
    branches:
      - Integration
      - main
      - feat/frame_pacing_metal

jobs:
  build:
    name: Build VoidLink IPA
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build VoidLink
        run: |
          xcodebuild -verbose -scheme VoidLink -sdk iphoneos \
            -configuration "${{ github.event.inputs.configuration || 'Release' }}" archive \
            -archivePath $PWD/build/VoidLink.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED="NO" \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGNING_ALLOWED="NO"
          mkdir -p ./build/IPA/Payload
          cp -r ./build/VoidLink.xcarchive/Products/Applications/VoidLink.app ./build/IPA/Payload/VoidLink.app
          cd ./build/IPA
          rm -f ../VoidLink.ipa
          zip -r ../VoidLink.ipa Payload
          cd ../..

      - name: Upload VoidLink IPA to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VoidLink-${{ github.event.inputs.configuration || 'Release' }}.ipa
          path: build/VoidLink.ipa